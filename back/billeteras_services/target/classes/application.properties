spring.application.name=wallet_service





spring.web.error.include-binding-errors=always

spring.web.error.include-message=always



spring.datasource.url=jdbc:mysql://localhost:3306/billeteras_services?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



server.port=7576

app.name=billeteras_services
app.version=1.0.0
